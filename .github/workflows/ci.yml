name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: cams_record_test
          MARIADB_USER: cams_record
          MARIADB_PASSWORD: cams_record
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CAMS_TEST_DB_HOST: 127.0.0.1
      CAMS_TEST_DB_PORT: "3306"
      CAMS_TEST_DB_USER: cams_record
      CAMS_TEST_DB_PASSWORD: cams_record
      CAMS_TEST_DB_NAME: cams_record_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo apt-get install -y --no-install-recommends -o Dpkg::Use-Pty=0 ffmpeg; then
              exit 0
            fi
            echo "apt ffmpeg install failed (attempt ${attempt}); retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "apt ffmpeg install failed after retries" >&2
          exit 1
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Grant access to the isolated production-shaped detection test schema
        run: |
          python - <<'PY'
          import pymysql
          conn = pymysql.connect(host="127.0.0.1", user="root", password="rootpw", autocommit=True)
          with conn.cursor() as cur:
              cur.execute("GRANT ALL ON cams_detect.* TO 'cams_record'@'%'")
              cur.execute("CREATE DATABASE IF NOT EXISTS cams_config_test")
              cur.execute("GRANT ALL ON cams_config_test.* TO 'cams_record'@'%'")
          conn.close()
          PY
      - name: Unit tests (MariaDB-backed)
        run: |
          set -euo pipefail
          python -m pytest -q -rs -m "not integration" | tee /tmp/unit.txt
      - name: Fail if MariaDB tests were skipped
        run: |
          set -euo pipefail
          if ! test -s /tmp/unit.txt; then
            echo "unit test log missing; pytest result was not captured" >&2
            exit 1
          fi
          if grep -q 'SKIPPED' /tmp/unit.txt; then
            echo "Required MariaDB tests were skipped" >&2
            grep 'SKIPPED' /tmp/unit.txt >&2 || true
            exit 1
          fi
      - name: Integration test (3 x 60 s segments from a looped testsrc file)
        run: |
          set -euo pipefail
          python -m pytest -q -rs -m integration | tee /tmp/integration.txt
      - name: Fail if the integration test was skipped
        run: |
          set -euo pipefail
          if ! test -s /tmp/integration.txt; then
            echo "integration test log missing; pytest result was not captured" >&2
            exit 1
          fi
          if grep -q 'SKIPPED' /tmp/integration.txt; then
            echo "Required integration tests were skipped" >&2
            grep 'SKIPPED' /tmp/integration.txt >&2 || true
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image with the legacy builder
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build -t cams-record:ci .
      - name: Smoke test image (ffmpeg present, config parses, healthz answers)
        run: |
          docker run --rm --entrypoint ffmpeg cams-record:ci -hide_banner -version | head -1
          mkdir -p /tmp/cr/config
          cp config/cameras.example.yaml /tmp/cr/config/cameras.yaml
          docker run -d --name cr --network host -v /tmp/cr/config:/config:ro \
            -e RECORD_ROOT=/tmp/nvr -e HTTP_PORT=18099 cams-record:ci --config-dir /config --no-db
          for i in $(seq 1 20); do
            docker exec -e HTTP_PORT=18099 cr python /app/scripts/healthcheck.py && ok=1 && break
            sleep 1
          done
          docker logs cr
          test "$ok" = 1
          docker logs cr | grep -q "front-door/main"
          docker stop cr
