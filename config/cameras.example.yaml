# cams-record cameras. Copy to config/cameras.yaml.
# ids must match cams_detect.cameras.camera_id; streams are go2rtc stream names
# (recorded from rtsp://127.0.0.1:8554/<stream>).
cameras:
  front-door:
    main_stream: front-door
    sub_stream: front-door-sub
    enabled: true
    record_main: true
    record_sub: true
