# cams-record global settings (optional; every key has a default). Copy to config/config.yaml.
log_level: INFO
base_path: /cams-record
http: {host: 127.0.0.1, port: 8097}
go2rtc:
  rtsp_url: rtsp://127.0.0.1:8554/{stream}
recording:
  root: /volume1/nvr
  segment_time: 60       # seconds
  stall_factor: 3        # restart ffmpeg when no segment closed in 3 x segment_time
  backoff_initial: 1     # restart backoff 1 s .. 60 s
  backoff_max: 60
  audio: auto            # auto = copy audio only when the source track is AAC; off = video only
  min_free_gb: 200       # below: stop main, keep sub; below half of this: stop sub too; 0 disables
  resume_free_gb: 250    # resume once free space is back above this
retention:
  dry_run: true          # log and report what would be deleted, delete nothing; false = really delete
  main_days: 3
  sub_days: 14
  max_total_gb: 1500     # budget for indexed bytes; over it the oldest main, then sub, is deleted
  interval_s: 300
  batch_size: 500        # most segments handled per pass
  nice: 19               # janitor thread only
  # cameras:             # optional per-camera overrides
  #   front-door: {main_days: 7, sub_days: 30}
auth:
  mode: jwt              # jwt | none (none only for local testing)
  secret_file: /run/secrets/apphub_jwt
  app_id: cams-record    # required JWT audience
db:
  host: 127.0.0.1        # the NAS's MariaDB 10 (host networking)
  port: 3306
  database: cams_record
  user: cams_record
  password_file: /run/secrets/db_password
clips:
  cache_dir: ""          # default: recording.state_dir/clips, outside recording.root
  max_cache_gb: 2
  max_age_s: 86400
  timeout_s: 120
  timezone: America/Chicago
detection_protection:
  enabled: true
  interval_s: 60
  days: 14
  lookback_s: 600
  pre_s: 5
  post_s: 5
  fallback_s: 10
  max_window_s: 120
